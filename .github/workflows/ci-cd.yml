name: CI/CD website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Kiểm thử và build (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Chạy kiểm thử
        run: node --test
      - name: Tạo website
        run: node scripts/build.js
      - name: Đóng gói website cho GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Triển khai (CD)
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
